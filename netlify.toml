[build]
  command   = "yarn build"
  publish   = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP includes 'unsafe-inline' for JSON-LD structured data (schema.org) and PostHog analytics.
    # 'unsafe-eval' has been removed as Soroban SDK does not require it.
    # Future: implement CSP nonces with Next.js next/script for JSON-LD and analytics injection points.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://app.posthog.com https://us-assets.i.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://horizon.stellar.org https://horizon-testnet.stellar.org https://soroban.stellar.org https://soroban-testnet.stellar.org https://app.posthog.com https://us.i.posthog.com https://us-assets.i.posthog.com https://*.walletconnect.com https://*.walletconnect.org; img-src 'self' data: blob: https://app.posthog.com; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
